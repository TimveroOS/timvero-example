<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<table class="table">
    <thead>
        <tr role="row">
            <th class="w-5"></th>
            <th class="w-25" th:text="#{symbol.id}"></th>
            <th class="w-20" th:text="#{application.status}"></th>
            <th class="w-25" th:text="#{application.condition.amount}"></th>
            <th class="w-25" th:text="#{common.createdAt}"></th>
        </tr>
    </thead>
    <tbody class="accordion" id="clientApplications">
        <th:block th:each="app, iterStat : ${clientApplications}">
            <tr
                role="row"
                data-toggle="collapse"
                class="no-ajax borrower__applicationRow collapsed"
                aria-expanded="false"
                th:data-target="'#application_' + ${app.id}"
                th:aria-controls="'application_' + ${app.id}"
            >
                <td>
                    <div class="collapse-btn">
                        <th:block th:insert="~{/icons/icons :: toggleArrow}"></th:block>
                    </div>
                </td>
                <td>
                    <a
                        th:text="${app.id}"
                        th:with="appPath = ${@pathRegistry.getPath(app)}"
                        th:href="@{${appPath}}"
                    ></a>
                </td>
                <td>
                    <span th:text="${#enums.name(app.status)}" th:style="'color: '+${#enums.name('application.status.color', app.status)}">Primary</span>
                </td>
                <td>
                    <span th:text="${#monetary.format(app?.condition?.principal)}">
                        EUR 10000
                    </span>
                </td>
                <td>
                    <span th:text="${#ldates.format(app.createdAt)}">
                        12/12/12 12:12
                    </span>
                </td>
            </tr>
            <tr th:id="application_ + ${app.id}" class="collapse">
                <td colspan="100%">
                    <div class="borrower__collapseApplication">
                        <div class="card-info-wrapper d-flex collapse-content">
                            <div class="card-info d-flex">
                                <ul class="card-info__body d-flex">
                                    <li class="card-info__item d-flex">
                                        <span class="card-info__property" title="Application ID">Application ID</span>
                                        <span class="card-info__value" th:text="${app.id}"></span>
                                    </li>
                                    <li class="card-info__item d-flex">
                                        <span class="card-info__property" title="Application Status">Application Status</span>
                                        <span
                                            class="card-info__value"
                                            th:text="${#enums.name(app.status)}"
                                            th:style="'color: '+${#enums.name('application.status.color', app.status)}"
                                        ></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-info d-flex">
                                <ul class="card-info__body d-flex">
                                    <li class="card-info__item d-flex">
                                        <span class="card-info__property" title="Application Date">Application Date</span>
                                        <span class="card-info__value" th:text="${#ldates.format(app.createdAt)}"></span>
                                    </li>

                                    <li class="card-info__item d-flex">
                                        <span
                                            class="card-info__property"
                                            th:text="#{application.condition.currency}"
                                            th:title="#{application.condition.currency}"
                                        ></span>
                                        <span class="card-info__value" th:text="${app.condition?.principal?.currency}"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </th:block>
    </tbody>
</table>
</html>
